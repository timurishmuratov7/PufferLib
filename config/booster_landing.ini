[base]
env_name = booster_landing
checkpoint_interval = 50

[env]
num_envs = 1024
width = 960
height = 720
max_episode_steps = 1200
# Must match train.horizon so new episodes begin with reset native MinGRU state.
rollout_horizon = 128
initial_altitude = 2000.0
initial_downward_velocity = 35.0
reset_altitude_min = 100.0
reset_altitude_max = 1500.0
reset_downward_velocity_min = 5.0
reset_downward_velocity_max = 25.0
reset_x_min = -40.0
reset_x_max = 40.0
reset_angle_min = -0.05
reset_angle_max = 0.05
reset_seed = 0
benchmark_single_episode = 0
dry_mass = 120.0
initial_fuel = 100.0
gravity = 9.81
thrust = 3300.0
side_thrust = 80.0
fuel_burn_rate = 6.0
side_fuel_burn_rate = 0.8
moment_arm = 8.0
moment_inertia = 3200.0
dt = 0.05
max_landing_speed = 5.0
terminal_reward_scale = 1.0
max_landing_x_speed = 8.0
# Zero-angle target with tolerances for discrete 50 ms side-thruster control.
max_landing_angle = 0.03
max_landing_angular_velocity = 0.05
world_width = 420.0
landing_pad_width = 160.0
max_velocity_obs = 200.0
max_x_velocity_obs = 40.0
max_angular_velocity_obs = 1.0
safety_reward_scale = 0.1
reward_gamma = 0.9999

[policy]
hidden_size = 128
num_layers = 1

[train]
total_timesteps = 1_000_000_000
learning_rate = 0.00003
clip_coef = 0.2
gamma = 0.9999
gae_lambda = 0.97
horizon = 128
minibatch_size = 8192
prio_alpha = 0.0
vf_coef = 0.5
ent_coef = 0.0
anneal_ent_coef = 0
min_ent_coef_ratio = 0.0

[sweep]
metric = score
sweep_only = total_timesteps,total_agents
max_runs = 24
max_suggestion_cost = 900
downsample = 8

[sweep.train.total_timesteps]
distribution = log_normal
min = 30_000_000
max = 1_000_000_000
scale = time

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 8192
scale = auto
