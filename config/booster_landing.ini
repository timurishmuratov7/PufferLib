[base]
env_name = booster_landing

[env]
num_envs = 1024
width = 960
height = 720
max_episode_steps = 600
initial_altitude = 1000.0
initial_downward_velocity = 35.0
reset_altitude_min = 50.0
reset_altitude_max = 1000.0
reset_downward_velocity_min = 5.0
reset_downward_velocity_max = 35.0
dry_mass = 120.0
initial_fuel = 80.0
gravity = 9.81
thrust = 3000.0
fuel_burn_rate = 6.0
dt = 0.05
max_landing_speed = 5.0
landing_pad_width = 80.0
max_velocity_obs = 80.0

[policy]
hidden_size = 128
num_layers = 1

[train]
total_timesteps = 10_000_000
horizon = 128
minibatch_size = 8192

[sweep]
metric = score
sweep_only = total_timesteps,total_agents
max_runs = 24
max_suggestion_cost = 900
downsample = 8

[sweep.train.total_timesteps]
distribution = log_normal
min = 30_000_000
max = 1_000_000_000
scale = time

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 8192
scale = auto
