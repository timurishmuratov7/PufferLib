[base]
env_name = flappy

[env]
num_envs = 1024
width = 288
height = 512
ground_y = 400
gravity = 0.45
flap_velocity = -7.5
max_fall_speed = 10.0
pipe_speed = 2.0
pipe_width = 52
pipe_gap = 100
pipe_spacing = 160

[policy]
hidden_size = 128
num_layers = 1

[train]
total_timesteps = 10_000_000
horizon = 128
minibatch_size = 8192

[sweep]
metric = score
sweep_only = total_timesteps,total_agents
max_runs = 24
max_suggestion_cost = 900
downsample = 8

[sweep.train.total_timesteps]
distribution = log_normal
min = 30_000_000
max = 1_000_000_000
scale = time

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 8192
scale = auto
